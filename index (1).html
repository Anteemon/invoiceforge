<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InvoiceForge — Professional Invoices in 30 Seconds</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
    * { font-family: 'Sora', sans-serif; box-sizing: border-box; margin: 0; padding: 0; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(20px);} to { opacity:1; transform:translateY(0);} }
    @keyframes shimmer { 0%{background-position:-200% 0;} 100%{background-position:200% 0;} }
    .fade-up { animation: fadeUp 0.5s ease forwards; }
    .shimmer-btn {
      background: linear-gradient(90deg, #1B98E0 0%, #0F4C75 40%, #1B98E0 100%);
      background-size: 200% 100%;
      animation: shimmer 2.5s infinite linear;
    }
    .card-hover { transition: all 0.2s ease; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(15,76,117,0.15); }
    input, textarea { font-family: 'Sora', sans-serif; }
    input[type=number]::-webkit-inner-spin-button { opacity: 0.5; }
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useCallback } = React;

const T = { brand:"#0F4C75", accent:"#1B98E0", light:"#E8F4FD", dark:"#0A1628", gold:"#F5A623" };

// Simple SVG icons (replacing lucide-react)
const Icon = ({ d, size=16, color="currentColor", fill="none" }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    {Array.isArray(d) ? d.map((p,i) => <path key={i} d={p}/>) : <path d={d}/>}
  </svg>
);
const icons = {
  file: ["M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z","M14 2v6h6","M16 13H8","M16 17H8","M10 9H8"],
  plus: "M12 5v14M5 12h14",
  trash: ["M3 6h18","M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6","M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"],
  download: ["M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4","M7 10l5 5 5-5","M12 15V3"],
  sparkles: ["M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5z","M5 3l.75 2.25L8 6l-2.25.75L5 9l-.75-2.25L2 6l2.25-.75z","M19 13l.75 2.25L22 16l-2.25.75L19 19l-.75-2.25L16 16l2.25-.75z"],
  check: "M22 11.08V12a10 10 0 1 1-5.93-9.14M22 4 12 14.01l-3-3",
  arrow: "M5 12h14M12 5l7 7-7 7",
  zap: "M13 2 3 14h9l-1 8 10-12h-9l1-8z",
  shield: "M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z",
  clock: ["M12 22c5.52 0 10-4.48 10-10S17.52 2 12 2 2 6.48 2 12s4.48 10 10 10z","M12 6v6l4 2"],
  star: "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z",
};

// ── LANDING ──────────────────────────────────────────────────────────────────
const Landing = ({ onLaunch }) => (
  <div style={{ background: T.dark, minHeight:"100vh", color:"white" }}>
    <nav className="no-print" style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"20px 48px", borderBottom:"1px solid rgba(255,255,255,0.08)" }}>
      <div style={{ display:"flex", alignItems:"center", gap:10 }}>
        <div style={{ width:36, height:36, borderRadius:10, background:T.accent, display:"flex", alignItems:"center", justifyContent:"center" }}>
          <Icon d={icons.file} size={18} color="white" />
        </div>
        <span style={{ fontWeight:700, fontSize:20, letterSpacing:-0.5 }}>InvoiceForge</span>
      </div>
      <div style={{ display:"flex", gap:12, alignItems:"center" }}>
        <span style={{ color:"rgba(255,255,255,0.5)", fontSize:14 }}>$19/mo</span>
        <button onClick={onLaunch} style={{ background:T.accent, color:"white", border:"none", padding:"10px 24px", borderRadius:8, fontWeight:600, cursor:"pointer", fontSize:14 }}>
          Try Free →
        </button>
      </div>
    </nav>

    <div className="fade-up" style={{ textAlign:"center", padding:"80px 24px 60px", maxWidth:720, margin:"0 auto" }}>
      <div style={{ display:"inline-flex", alignItems:"center", gap:8, background:"rgba(27,152,224,0.15)", border:"1px solid rgba(27,152,224,0.3)", borderRadius:100, padding:"6px 16px", marginBottom:28, fontSize:13, color:T.accent }}>
        ✦ AI-Powered · Instant · Professional
      </div>
      <h1 style={{ fontSize:54, fontWeight:800, lineHeight:1.1, letterSpacing:-2, margin:"0 0 20px" }}>
        Create invoices<br/><span style={{ color:T.accent }}>in 30 seconds.</span>
      </h1>
      <p style={{ fontSize:18, color:"rgba(255,255,255,0.55)", lineHeight:1.7, margin:"0 0 40px" }}>
        Stop wasting time on paperwork. InvoiceForge generates professional invoices with AI,
        calculates taxes automatically, and exports to PDF — so you get paid faster.
      </p>
      <button onClick={onLaunch} className="shimmer-btn" style={{ color:"white", border:"none", padding:"16px 40px", borderRadius:12, fontWeight:700, cursor:"pointer", fontSize:16 }}>
        Build Your First Invoice →
      </button>
      <p style={{ marginTop:16, fontSize:13, color:"rgba(255,255,255,0.3)" }}>Free forever · No credit card required</p>
    </div>

    <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:20, maxWidth:960, margin:"0 auto 80px", padding:"0 24px" }}>
      {[
        { icon: <Icon d={icons.zap} size={22} color={T.accent}/>, title:"AI Line Items", desc:"Describe your work and AI fills in professional line item descriptions instantly." },
        { icon: <Icon d={icons.shield} size={22} color={T.gold}/>, title:"Auto Tax Calc", desc:"Set your tax rate once. InvoiceForge applies it correctly to every invoice." },
        { icon: <Icon d={icons.clock} size={22} color="#52c41a"/>, title:"Instant PDF", desc:"Print-ready invoices with your branding. Export and send in one click." },
      ].map((f,i) => (
        <div key={i} className="card-hover" style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.08)", borderRadius:16, padding:28 }}>
          <div style={{ marginBottom:16 }}>{f.icon}</div>
          <h3 style={{ fontWeight:700, fontSize:18, margin:"0 0 8px" }}>{f.title}</h3>
          <p style={{ color:"rgba(255,255,255,0.45)", fontSize:14, lineHeight:1.6, margin:0 }}>{f.desc}</p>
        </div>
      ))}
    </div>

    <div style={{ maxWidth:800, margin:"0 auto", padding:"0 24px 80px" }}>
      <h2 style={{ textAlign:"center", fontSize:34, fontWeight:800, margin:"0 0 8px", letterSpacing:-1 }}>Simple pricing</h2>
      <p style={{ textAlign:"center", color:"rgba(255,255,255,0.45)", margin:"0 0 40px" }}>Start free. Upgrade when you're ready.</p>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:16 }}>
        {[
          { name:"Free", price:"$0", period:"forever", bg:"rgba(255,255,255,0.06)", features:["5 invoices/month","Basic PDF export","Manual tax entry"] },
          { name:"Pro", price:"$19", period:"/month", bg:"rgba(27,152,224,0.2)", border:T.accent, badge:"Most Popular", features:["Unlimited invoices","AI line items","Auto tax + subtotals","Custom branding","Priority support"] },
          { name:"Business", price:"$49", period:"/month", bg:"rgba(255,255,255,0.04)", features:["Everything in Pro","Team seats (5)","API access","White-label","CSV bulk export"] },
        ].map((tier,i) => (
          <div key={i} style={{ background:tier.bg, border:`1px solid ${tier.border||"rgba(255,255,255,0.08)"}`, borderRadius:16, padding:24, position:"relative" }}>
            {tier.badge && <div style={{ position:"absolute", top:-12, left:"50%", transform:"translateX(-50%)", background:T.accent, color:"white", fontSize:11, fontWeight:700, padding:"4px 12px", borderRadius:100 }}>{tier.badge}</div>}
            <div style={{ fontWeight:700, fontSize:15, marginBottom:8, color:"rgba(255,255,255,0.7)" }}>{tier.name}</div>
            <div style={{ fontSize:36, fontWeight:800, letterSpacing:-1 }}>{tier.price}<span style={{ fontSize:14, fontWeight:400, color:"rgba(255,255,255,0.4)" }}>{tier.period}</span></div>
            <div style={{ marginTop:20, display:"flex", flexDirection:"column", gap:10 }}>
              {tier.features.map((f,j) => (
                <div key={j} style={{ display:"flex", gap:8, alignItems:"center", fontSize:13, color:"rgba(255,255,255,0.65)" }}>
                  <Icon d={icons.check} size={14} color={tier.border||"rgba(255,255,255,0.3)"}/> {f}
                </div>
              ))}
            </div>
            <button onClick={onLaunch} style={{ marginTop:24, width:"100%", background:i===1?T.accent:"rgba(255,255,255,0.08)", color:"white", border:"none", padding:"12px", borderRadius:8, fontWeight:600, cursor:"pointer", fontSize:14 }}>
              {i===0?"Get Started":"Start Free Trial"}
            </button>
          </div>
        ))}
      </div>
    </div>
  </div>
);

// ── APP ───────────────────────────────────────────────────────────────────────
const newItem = () => ({ id: Date.now()+Math.random(), desc:"", qty:1, rate:0 });

const App = ({ onBack }) => {
  const [from, setFrom] = useState({ name:"Your Business", email:"you@business.com", address:"123 Main St, City, State" });
  const [to, setTo]     = useState({ name:"", email:"", address:"" });
  const [items, setItems] = useState([newItem()]);
  const [num, setNum]   = useState("INV-001");
  const [due, setDue]   = useState(() => { const d=new Date(); d.setDate(d.getDate()+30); return d.toISOString().split("T")[0]; });
  const [tax, setTax]   = useState(10);
  const [notes, setNotes] = useState("Thank you for your business!");
  const [aiText, setAiText] = useState("");
  const [aiLoading, setAiLoading] = useState(false);
  const [toast, setToast] = useState(null);

  const showToast = (msg, type="success") => { setToast({msg,type}); setTimeout(()=>setToast(null),3000); };

  const sub   = items.reduce((s,i)=>s+(parseFloat(i.qty)||0)*(parseFloat(i.rate)||0),0);
  const taxAmt = sub*(tax/100);
  const total  = sub+taxAmt;

  const upd = (id,f,v) => setItems(p=>p.map(i=>i.id===id?{...i,[f]:v}:i));

  const generateAI = useCallback(async () => {
    if (!aiText.trim()) return;
    setAiLoading(true);
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          model:"claude-sonnet-4-20250514",
          max_tokens:1000,
          system:'Return ONLY a JSON array of invoice line items: [{"desc":"...","qty":1,"rate":500}]. No explanation, no markdown.',
          messages:[{role:"user", content:`Create invoice line items for: ${aiText}`}]
        })
      });
      const data = await res.json();
      const parsed = JSON.parse(data.content[0].text.replace(/```json|```/g,"").trim());
      setItems(parsed.map(i=>({...i, id:Date.now()+Math.random()})));
      setAiText("");
      showToast(`✨ Generated ${parsed.length} line items!`);
    } catch(e) { showToast("Couldn't generate. Try again.","error"); }
    setAiLoading(false);
  }, [aiText]);

  const inp = { background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:8, padding:"8px 12px", color:"white", fontSize:13, width:"100%", outline:"none" };
  const lbl = { fontSize:11, fontWeight:600, color:"rgba(255,255,255,0.4)", textTransform:"uppercase", letterSpacing:1, display:"block", marginBottom:6 };

  return (
    <div style={{ background:"#0D1B2A", minHeight:"100vh", color:"white" }}>
      <div className="no-print" style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"16px 32px", borderBottom:"1px solid rgba(255,255,255,0.06)", background:T.dark }}>
        <div style={{ display:"flex", alignItems:"center", gap:12 }}>
          <button onClick={onBack} style={{ background:"none", border:"none", color:"rgba(255,255,255,0.4)", cursor:"pointer", fontSize:13 }}>← Back</button>
          <span style={{ color:"rgba(255,255,255,0.15)" }}>|</span>
          <Icon d={icons.file} size={18} color={T.accent}/>
          <span style={{ fontWeight:700 }}>InvoiceForge</span>
        </div>
        <button onClick={()=>window.print()} style={{ background:T.accent, color:"white", border:"none", padding:"10px 22px", borderRadius:8, fontWeight:600, cursor:"pointer", fontSize:13 }}>
          ↓ Export PDF
        </button>
      </div>

      <div style={{ maxWidth:1100, margin:"0 auto", padding:"32px 24px", display:"grid", gridTemplateColumns:"1fr 380px", gap:24 }}>
        {/* LEFT */}
        <div style={{ display:"flex", flexDirection:"column", gap:20 }}>

          {/* AI BOX */}
          <div className="no-print" style={{ background:"linear-gradient(135deg,rgba(27,152,224,0.15),rgba(15,76,117,0.1))", border:"1px solid rgba(27,152,224,0.25)", borderRadius:14, padding:20 }}>
            <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:14 }}>
              <Icon d={icons.sparkles} size={16} color={T.accent}/>
              <span style={{ fontWeight:700, fontSize:14 }}>AI Line Item Generator</span>
            </div>
            <div style={{ display:"flex", gap:10 }}>
              <input value={aiText} onChange={e=>setAiText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&generateAI()}
                placeholder='e.g. "3 days React dev, logo design, 2 revision rounds"'
                style={{...inp, flex:1}}/>
              <button onClick={generateAI} disabled={aiLoading} style={{ background:T.accent, color:"white", border:"none", padding:"8px 18px", borderRadius:8, fontWeight:600, cursor:"pointer", fontSize:13, opacity:aiLoading?.7:1 }}>
                {aiLoading?"...":"Generate"}
              </button>
            </div>
          </div>

          {/* FROM / TO */}
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16 }}>
            {[{label:"From (Your Business)",data:from,set:setFrom},{label:"Bill To (Client)",data:to,set:setTo}].map(({label,data,set})=>(
              <div key={label} style={{ background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.07)", borderRadius:14, padding:18 }}>
                <div style={{...lbl, marginBottom:14, color:T.accent}}>{label}</div>
                {["name","email","address"].map(f=>(
                  <div key={f} style={{ marginBottom:10 }}>
                    <label style={lbl}>{f}</label>
                    <input value={data[f]} onChange={e=>set(p=>({...p,[f]:e.target.value}))} style={inp}/>
                  </div>
                ))}
              </div>
            ))}
          </div>

          {/* META */}
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:12 }}>
            {[{label:"Invoice #",val:num,set:setNum},{label:"Due Date",val:due,set:setDue,type:"date"},{label:"Tax Rate (%)",val:tax,set:v=>setTax(parseFloat(v)||0),type:"number"}].map(({label,val,set,type="text"})=>(
              <div key={label}>
                <label style={lbl}>{label}</label>
                <input type={type} value={val} onChange={e=>set(e.target.value)} style={{...inp,textAlign:type==="number"?"center":"left"}}/>
              </div>
            ))}
          </div>

          {/* LINE ITEMS */}
          <div style={{ background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.07)", borderRadius:14, padding:20 }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
              <span style={{ fontWeight:700, fontSize:14 }}>Line Items</span>
              <button onClick={()=>setItems(p=>[...p,newItem()])} className="no-print" style={{ background:"rgba(27,152,224,0.2)", color:T.accent, border:"1px solid rgba(27,152,224,0.3)", padding:"6px 14px", borderRadius:8, cursor:"pointer", fontSize:12, fontWeight:600 }}>
                + Add Item
              </button>
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 70px 90px 90px 36px", gap:8, marginBottom:10 }}>
              {["Description","Qty","Rate ($)","Amount",""].map(h=><div key={h} style={{...lbl,margin:0}}>{h}</div>)}
            </div>
            {items.map(item=>(
              <div key={item.id} style={{ display:"grid", gridTemplateColumns:"1fr 70px 90px 90px 36px", gap:8, marginBottom:8, alignItems:"center" }}>
                <input value={item.desc} onChange={e=>upd(item.id,"desc",e.target.value)} placeholder="Service description" style={inp}/>
                <input type="number" value={item.qty} onChange={e=>upd(item.id,"qty",e.target.value)} style={{...inp,textAlign:"center"}}/>
                <input type="number" value={item.rate} onChange={e=>upd(item.id,"rate",e.target.value)} style={{...inp,textAlign:"right"}}/>
                <div className="mono" style={{ textAlign:"right", fontSize:13, color:"rgba(255,255,255,0.7)", padding:"8px 12px", background:"rgba(255,255,255,0.03)", borderRadius:8 }}>
                  ${((parseFloat(item.qty)||0)*(parseFloat(item.rate)||0)).toFixed(2)}
                </div>
                <button className="no-print" onClick={()=>setItems(p=>p.filter(i=>i.id!==item.id))} style={{ background:"rgba(255,60,60,0.1)", border:"1px solid rgba(255,60,60,0.2)", borderRadius:8, width:36, height:36, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>
                  <Icon d={icons.trash} size={13} color="#ff6b6b"/>
                </button>
              </div>
            ))}
          </div>

          <div>
            <label style={lbl}>Notes / Payment Terms</label>
            <textarea value={notes} onChange={e=>setNotes(e.target.value)} rows={2} style={{...inp,resize:"none",lineHeight:1.6}}/>
          </div>
        </div>

        {/* RIGHT — INVOICE PREVIEW */}
        <div>
          <div style={{ background:"white", borderRadius:16, padding:28, color:T.dark, position:"sticky", top:24 }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:24, paddingBottom:20, borderBottom:"2px solid "+T.light }}>
              <div>
                <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:4 }}>
                  <div style={{ width:28, height:28, borderRadius:8, background:T.accent, display:"flex", alignItems:"center", justifyContent:"center" }}>
                    <Icon d={icons.file} size={14} color="white"/>
                  </div>
                  <span style={{ fontWeight:800, fontSize:15, color:T.brand }}>{from.name||"Your Business"}</span>
                </div>
                <div style={{ fontSize:11, color:"#888", lineHeight:1.6 }}>{from.email}<br/>{from.address}</div>
              </div>
              <div style={{ textAlign:"right" }}>
                <div style={{ fontSize:20, fontWeight:800, color:T.brand, letterSpacing:-0.5 }}>INVOICE</div>
                <div className="mono" style={{ fontSize:12, color:T.accent, fontWeight:600 }}>{num}</div>
                <div style={{ fontSize:11, color:"#888", marginTop:4 }}>Due {due}</div>
              </div>
            </div>

            {to.name && (
              <div style={{ marginBottom:20, background:T.light, borderRadius:10, padding:"12px 14px" }}>
                <div style={{ fontSize:10, fontWeight:700, color:T.brand, textTransform:"uppercase", letterSpacing:1, marginBottom:4 }}>Bill To</div>
                <div style={{ fontWeight:700, fontSize:13 }}>{to.name}</div>
                <div style={{ fontSize:11, color:"#666" }}>{to.email} · {to.address}</div>
              </div>
            )}

            <div style={{ marginBottom:16 }}>
              {items.filter(i=>i.desc||i.rate).map((item,idx)=>(
                <div key={item.id} style={{ display:"flex", justifyContent:"space-between", padding:"8px 0", borderBottom:idx<items.length-1?"1px solid "+T.light:"none" }}>
                  <div>
                    <div style={{ fontSize:12, fontWeight:600 }}>{item.desc||"Service"}</div>
                    <div style={{ fontSize:11, color:"#999" }}>{item.qty} × ${parseFloat(item.rate||0).toFixed(2)}</div>
                  </div>
                  <div className="mono" style={{ fontSize:12, fontWeight:600, color:T.brand }}>
                    ${((parseFloat(item.qty)||0)*(parseFloat(item.rate)||0)).toFixed(2)}
                  </div>
                </div>
              ))}
            </div>

            <div style={{ background:T.light, borderRadius:10, padding:"14px 16px" }}>
              {[["Subtotal",`$${sub.toFixed(2)}`],[`Tax (${tax}%)`,`$${taxAmt.toFixed(2)}`]].map(([l,v])=>(
                <div key={l} style={{ display:"flex", justifyContent:"space-between", fontSize:12, color:"#666", marginBottom:8 }}>
                  <span>{l}</span><span className="mono">{v}</span>
                </div>
              ))}
              <div style={{ display:"flex", justifyContent:"space-between", fontWeight:800, fontSize:16, borderTop:"1px solid rgba(15,76,117,0.15)", paddingTop:10, color:T.brand }}>
                <span>Total Due</span>
                <span className="mono">${total.toFixed(2)}</span>
              </div>
            </div>

            {notes && <div style={{ marginTop:14, fontSize:11, color:"#888", lineHeight:1.6, borderTop:"1px solid "+T.light, paddingTop:12 }}>{notes}</div>}

            <div style={{ marginTop:16, textAlign:"center", fontSize:11, color:"#ccc" }}>
              ★ Made with InvoiceForge
            </div>
          </div>
        </div>
      </div>

      {toast && (
        <div style={{ position:"fixed", bottom:28, left:"50%", transform:"translateX(-50%)", background:toast.type==="error"?"#ff4444":"#111827", color:"white", padding:"12px 24px", borderRadius:100, fontSize:13, fontWeight:600, border:"1px solid rgba(255,255,255,0.1)", boxShadow:"0 8px 32px rgba(0,0,0,0.4)", zIndex:9999 }}>
          {toast.msg}
        </div>
      )}
    </div>
  );
};

// ── ROOT ──────────────────────────────────────────────────────────────────────
const InvoiceForge = () => {
  const [view, setView] = useState("landing");
  return view === "landing"
    ? <Landing onLaunch={() => setView("app")} />
    : <App onBack={() => setView("landing")} />;
};

ReactDOM.createRoot(document.getElementById("root")).render(<InvoiceForge />);
</script>
</body>
</html>
